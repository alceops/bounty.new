name: OSS Bounty Radar custom data request
about: Maintainers/founders/operators can request a paid public-data-only repo queue cleanup or bounty shortlist.
title: "OSS Bounty Radar custom request: <repo or niche>"
labels: ["oss-bounty-radar", "buyer-signal", "custom-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this only if you maintain, fund, or operate a public repo/queue and want a repo-specific public-data readout rather than general feedback.

        This is **not** a code bounty, PR request, implementation task, or place to claim work. Contributor "working on this" replies are not qualified demand and will be closed as invalid.

        Current price hypothesis: `$50` for a diagnostic, `$100` for a repo cleanup table, or `$150` for a cleanup plus 7-day public-signal monitor. Current sample: `docs/data-products/active-bounty-queue-sponsor-ops-sample-2026-05-01.md` plus CSV seed. This form is a fit check, not payment collection. We will not ask for private data or scrape around access controls.
  - type: dropdown
    id: requester_role
    attributes:
      label: Your role
      description: This route is for maintainers/founders/operators or agency leads with a queue they operate. Contributor code claims are invalid here.
      options:
        - Maintainer
        - Founder
        - Operator
        - Agency lead
    validations:
      required: true
  - type: input
    id: repo_or_niche
    attributes:
      label: Repo, org, or niche
      description: Public GitHub repo/org, bounty queue, or niche you maintain, fund, operate, or would pay to analyze.
      placeholder: "e.g. directus/directus bug backlog, n8n-io/n8n bug backlog, coollabsio/coolify backup issues"
    validations:
      required: true
  - type: dropdown
    id: requested_output
    attributes:
      label: Desired output
      description: Pick the report shape closest to what you would pay for.
      options:
        - $50 diagnostic - public issue/label snapshot with cleanup risks
        - $100 cleanup table - stale/crowded/unassigned/duplicate-risk queue triage
        - $150 cleanup + 7-day public-signal monitor
        - Not sure - show me the smallest useful slice first
    validations:
      required: true
  - type: textarea
    id: painful_queue_state
    attributes:
      label: What is painful
      description: Name the queue problem this should clean up.
      placeholder: "Examples: duplicate attempts, assignment ambiguity, payout/status clarity, stale bounty labels, noisy contributor queue, claimed PR status."
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions or safety constraints
      description: Anything we should avoid. Do not include private credentials, personal data, or non-public sources.
      placeholder: "Examples: public GitHub only; no Discord scraping; exclude token-paid bounties."
    validations:
      required: false
  - type: input
    id: safe_contact
    attributes:
      label: Optional safe contact route
      description: Public-safe contact route for one reply if the request is a fit.
      placeholder: "email@example.com or public profile URL"
    validations:
      required: false
