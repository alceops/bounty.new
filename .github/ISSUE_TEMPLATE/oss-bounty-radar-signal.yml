name: OSS Bounty Radar signal
about: Tell Alce whether a public-data bounty/maintenance queue readout is worth buying, building from, or killing.
title: "OSS Bounty Radar signal: <BUYER | BUILDER | NO>"
labels: ["oss-bounty-radar", "buyer-signal"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for one clear signal on the public-data-only OSS Bounty Radar / repo queue cleanup product.

        This is **not** a code bounty, PR request, or implementation task. Do not post "working on a fix" or generic build offers here; those are not buyer/maintainer signals and will be closed as invalid. Useful replies are only:
        - `BUYER`: a public repo/queue plus what would make a $49-$150 readout worth buying.
        - `BUILDER`: a concrete public-data source you can supply.
        - `NO`: the exact missing field/filter or reason this is not useful.

        Current examples:
        - Directus bug backlog mini-sample: `docs/data-products/directus-bug-backlog-mini-sample-2026-04-30.md`
        - n8n bug backlog mini-sample: `docs/data-products/n8n-bug-backlog-mini-sample-2026-04-30.md`
        - Coolify backup queue mini-sample: `docs/data-products/coolify-backup-queue-mini-sample-2026-04-30.md`
        - Formbricks bug backlog replacement route: `docs/data-products/formbricks-bug-backlog-replacement-route-2026-04-30.md`
        - Queue-cleanup SKU: `docs/data-products/oss-bounty-radar-queue-cleanup-sku-2026-04-29.md`

        No private data, no scraping around access controls, and no follow-up if not relevant.
  - type: dropdown
    id: signal
    attributes:
      label: Signal (not a code bounty / PR task)
      description: Pick the closest truthful signal. Generic "working on a fix" replies are invalid here.
      options:
        - BUYER - I might pay $49-$150 for this or a repo-specific cleanup.
        - BUILDER - I want to help build/supply this data.
        - NO - not useful; here is why.
    validations:
      required: true
  - type: input
    id: repo_or_queue
    attributes:
      label: Repo, queue, or niche
      description: Public repo/issue queue/niche this signal applies to.
      placeholder: "e.g. directus/directus bug backlog, n8n-io/n8n bug backlog, coollabsio/coolify backups"
    validations:
      required: true
  - type: textarea
    id: missing_fields
    attributes:
      label: Missing field, filter, or proof
      description: What would make the readout useful enough to buy, share, or reject confidently?
      placeholder: "Examples: maintainer activity, bounty freshness, duplicate-risk score, claimed PR status, estimated cleanup time."
    validations:
      required: true
  - type: textarea
    id: safe_contact
    attributes:
      label: Optional safe contact route
      description: If you want a one-time reply, provide a public-safe route. Do not include private credentials or sensitive data.
    validations:
      required: false
